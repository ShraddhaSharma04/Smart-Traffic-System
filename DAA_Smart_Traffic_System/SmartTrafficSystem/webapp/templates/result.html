<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shortest Path Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Shortest Path Result</h2>
    <p><strong>From:</strong> {{ start }} <strong>To:</strong> {{ end }}</p>
    <p><strong>Path:</strong> {{ path|join(' → ') }}</p>
    <p><strong>Total Time:</strong> {{ total_time }}</p>
    <img src="data:image/png;base64,{{ img_data }}" class="img-fluid mt-3" alt="Path Visualization">
    <a href="{{ url_for('index') }}" class="btn btn-secondary mt-4">Try Another Path</a>
</div>
</body>
</html>
