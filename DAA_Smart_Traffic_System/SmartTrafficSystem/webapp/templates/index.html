<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Traffic System - Shortest Path</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Smart Traffic System</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-warning">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}
    <form method="post">
        <div class="mb-3">
            <label for="start" class="form-label">Start Location</label>
            <select class="form-select" id="start" name="start" required>
                <option value="">Select start location</option>
                {% for node in nodes %}
                <option value="{{ node }}">{{ node }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="end" class="form-label">Destination</label>
            <select class="form-select" id="end" name="end" required>
                <option value="">Select destination</option>
                {% for node in nodes %}
                <option value="{{ node }}">{{ node }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Find Shortest Path</button>
    </form>
</div>
</body>
</html>
